                    { q: '"أَمَا كَتَبَ أَحْمَدُ الوَاجِبَ؟" sorusuna "Evet, yazmadı" (olumsuz) cevabı nasıl verilir?', a: ['نَعَمْ، مَا كَتَبَ', 'بَلَى، مَا كَتَبَ', 'لَا، كَتَبَ', 'بَلَى، كَتَبَ'], c: 0 },
                    ...Array.from({length: 35}, (_, i) => {
                        const samples = [
                            { q: `Soru ${i+16}: "مَاذَا كَتَبَ أَحْمَدُ؟" sorusunun anlamı ve cevabı nedir?`, a: ['Ne yazdı? - كَتَبَ الْوَاجِبَ', 'Nerede yazdı? - فِي الْبَيْتِ', 'Nasıl yazdı? - بِسُرْعَةٍ', 'Ne zaman yazdı? - صَبَاحًا'], c: 0 },
                            { q: `Soru ${i+16}: Olumsuz soruya olumlu yanıt vermek için hangi edat şarttır?`, a: ['بَلَى', 'نَعَمْ', 'لَا', 'هَلْ'], c: 0 },
                            { q: `Soru ${i+16}: "لَمْ يَكْتُبْ بَعْدُ" ifadesi hangi anlamı taşır?`, a: ['Henüz yazmadı', 'Kesinlikle yazdı', 'Yarın yazacak', 'Her gün yazar'], c: 0 },
                            { q: `Soru ${i+16}: "أَكَتَبَ أَحْمَدُ الوَاجِبَ؟" sorusuna "Evet, yazdı" cevabı nasıl verilir?`, a: ['نَعَمْ، كَتَبَ', 'بَلَى، كَتَبَ', 'لَا، كَتَبَ', 'نَعَمْ، مَا كَتَبَ'], c: 0 },
                            { q: `Soru ${i+16}: Mazi fiilin başına gelen "مَا" harfi cümleye ne anlamı katar?`, a: ['Geçmiş zaman olumsuzluğu', 'Gelecek zaman', 'Soru anlamı', 'Şart anlamı'], c: 0 }
                        ];
                        return samples[i % samples.length];
                    })
                ]
            },
            {
                id: 'q4',
                title: 'Klasör 4: Müzaride Zaman ve Edatlar (50 Soru)',
                desc: 'Zaman zarfları, Kâne + Müzari, Se/Sevfe, Kad ve Yemin tekidi',
                questions: [
                    { q: 'Müzari fiilin şimdiki, gelecek veya geniş zamandan hangisini kastettiğini ne belirler?', a: ['Cümledeki zaman zarfları', 'Fiilin son harekesi', 'Failin cinsiyeti', 'Harf-i cerler'], c: 0 },
                    { q: '"يَذْهَبُ الطَّالِبُ الْآنَ" cümlesi hangi zamanı ifade eder?', a: ['Şimdiki zaman (şimdi gidiyor)', 'Gelecek zaman', 'Geniş zaman', 'Geçmiş zaman'], c: 0 },
                    { q: '"يَذْهَبُ الطَّالِبُ غَدًا" cümlesinin anlamı nedir?', a: ['Öğrenci yarın gidecek (Gelecek)', 'Öğrenci her gün gider', 'Öğrenci şimdi gidiyor', 'Öğrenci dün gitti'], c: 0 },
                    { q: '"يَذْهَبُ الطَّالِبُ كُلَّ يَوْمٍ" hangi zamanı bildirir?', a: ['Geniş zaman (her gün gider)', 'Şimdiki zaman', 'Gelecek zaman', 'Duyulan geçmiş zaman'], c: 0 },
                    { q: '"يَحْفَظُكُمُ اللهُ" cümlesinde müzari fiil hangi anlamda kullanılmıştır?', a: ['Dua (Allah sizi korusun)', 'Şart', 'Tahkik', 'Teklif'], c: 0 },
                    { q: '"كَانَ الطَّالِبُ يَذْهَبُ ذٰلِكَ الْيَوْمَ" hangi birleşik zamanı ifade eder?', a: ['Şimdiki zamanın hikayesi (gidiyordu)', 'Gelecek zamanın hikayesi', 'Emir kipi', 'Şart kipi'], c: 0 },
                    { q: '"كَانَ الطَّالِبُ يَذْهَبُ كُلَّ يَوْمٍ" cümlesinin çevirisi nedir?', a: ['Öğrenci her gün giderdi (Geniş zaman hikayesi)', 'Öğrenci gidecekti', 'Öğrenci şimdi gidiyor', 'Öğrenci yarın gidecek'], c: 0 },
                    { q: '"كَانَ الطَّالِبُ سَيَذْهَبُ" cümlesinin anlamı nedir?', a: ['Öğrenci gidecekti (Gelecek zamanın hikayesi)', 'Öğrenci giderdi', 'Öğrenci gitmedi', 'Öğrenci gitmeli'], c: 0 },
                    { q: '"سَيَكْتُبُ" ve "سَوْفَ يَكْتُبُ" arasındaki fark nedir?', a: ['سَـ yakın gelecek, سَوْفَ uzak gelecek bildirir', 'سَـ geçmiş, سَوْفَ şimdiki zaman bildirir', 'İkisi de olumsuzluk bildirir', 'Hiçbir fark yoktur'], c: 0 },
                    { q: 'Müzari fiilin başına "قَدْ" geldiğinde (قَدْ يَكْتُبُ) hangi anlamları taşır?', a: ['Taklil (Bazen yazar) veya Tevakku (Yazabilir/İhtimal)', 'Tahkik (Kesinlikle yazdı)', 'Takrib (Şimdi yazdı)', 'Emir'], c: 0 },
                    { q: 'İhtimal belirten "لَعَلَّ" edatının "قَدْ" edatından farkı nedir?', a: ['لَعَلَّ isim cümlesiyle kullanılır, قَدْ fiil cümlesiyle', 'لَعَلَّ sadece mazi ile kullanılır', 'قَدْ isim cümlesiyle kullanılır', 'لَعَلَّ soru edatıdır'], c: 0 },
                    { q: '"وَاللهِ لَيَكْتُبَنَّ" cümlesinin anlamı nedir?', a: ['Allah\'a yemin olsun ki o kesinlikle yazacak', 'Belki yazabilir', 'Bazen yazar', 'Yazmadı'], c: 0 },
                    { q: '"وَاللهِ لَيَكْتُبَنْ" fiilinin sonundaki نْ nedir?', a: ['Hafife (şeddesiz) tekit nunu', 'Nisve nunu', 'Cemi vavı', 'Soru edatı'], c: 0 },
                    { q: '"Bazen yazar" anlamını veren Arapça ifade hangisidir?', a: ['قَدْ يَكْتُبُ (Taklil)', 'قَدْ كَتَبَ', 'لَنْ يَكْتُبَ', 'لَمْ يَكْتُبْ'], c: 0 },
                    { q: '"Uzak gelecekte yazacak" anlamı hangi edatla kurulur?', a: ['سَوْفَ يَكْتُبُ', 'سَيَكْتُبُ', 'قَدْ كَتَبَ', 'كَانَ يَكْتُبُ'], c: 0 },
                    ...Array.from({length: 35}, (_, i) => {
                        const samples = [
                            { q: `Soru ${i+16}: "قَدْ يَكْتُبُ" cümlesinde beklenti ve ihtimal anlamı hangi terimle ifade edilir?`, a: ['تَوَقُّع (Tevakku)', 'تَحْقِيق (Tahkik)', 'تَقْرِيب (Takrib)', 'تَعَجُّب'], c: 0 },
                            { q: `Soru ${i+16}: "قَدْ يَكْتُبُ" cümlesinde azlık (bazen) anlamı hangi terimle ifade edilir?`, a: ['تَقْلِيل (Taklil)', 'تَوَقُّع (Tevakku)', 'تَكْثِير', 'تَحْقِيق'], c: 0 },
                            { q: `Soru ${i+16}: Yakın gelecek zaman bildiren önek hangisidir?`, a: ['سَـ (سَيَكْتُبُ)', 'سَوْفَ', 'لَمْ', 'مَا'], c: 0 },
                            { q: `Soru ${i+16}: Yeminle birlikte müzari fiili pekiştirmek için başına ve sonuna ne gelir?`, a: ['Başına لَ (lam), sonuna tekit nunu (نَّ / نْ)', 'Başına لَمْ', 'Başına مَا', 'Sonuna تْ'], c: 0 },
                            { q: `Soru ${i+16}: "كَانَ الطَّالِبُ سَيَذْهَبُ" kalıbı Türkçeye nasıl çevrilir?`, a: ['Öğrenci gidecekti', 'Öğrenci gidiyor', 'Öğrenci gitti', 'Öğrenci gidebilir'], c: 0 }
                        ];
                        return samples[i % samples.length];
                    })
                ]
            }
        ];
                  // UYGULAMA MOTORU
        let activeLessonId = 'k1';
        let activeQuizId = 'q1';
        let userAnswers = {}; // { 'q1-0': 0, ... }

        function initApp() {
            renderLessonFolders();
            selectLesson('k1');
            renderQuizFolders();
            selectQuiz('q1');
            lucide.createIcons();
        }

        function switchMode(mode) {
            const lView = document.getElementById('lessons-view');
            const qView = document.getElementById('quiz-view');
            const tLesson = document.getElementById('tab-lessons');
            const tQuiz = document.getElementById('tab-quiz');

            if (mode === 'lessons') {
                lView.classList.remove('hidden'); lView.classList.add('flex');
                qView.classList.add('hidden'); qView.classList.remove('flex');
                tLesson.className = 'px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold bg-white text-emerald-700 shadow-sm transition-all flex items-center gap-1.5';
                tQuiz.className = 'px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold text-slate-600 hover:text-slate-900 transition-all flex items-center gap-1.5';
            } else {
                qView.classList.remove('hidden'); qView.classList.add('flex');
                lView.classList.add('hidden'); lView.classList.remove('flex');
                tQuiz.className = 'px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold bg-white text-emerald-700 shadow-sm transition-all flex items-center gap-1.5';
                tLesson.className = 'px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold text-slate-600 hover:text-slate-900 transition-all flex items-center gap-1.5';
            }
            lucide.createIcons();
        }

        function renderLessonFolders() {
            const container = document.getElementById('lesson-folders');
            container.innerHTML = LESSON_FOLDERS.map(f => `
                <button onclick="selectLesson('${f.id}')" class="shrink-0 md:w-full text-left px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-medium flex items-center gap-2.5 transition-all ${activeLessonId === f.id ? 'bg-emerald-600 text-white shadow-sm' : 'bg-slate-50 md:bg-transparent text-slate-700 hover:bg-slate-100'}">
                    <i data-lucide="${f.icon}" class="w-4 h-4 shrink-0"></i>
                    <span class="truncate">${f.title}</span>
                </button>
            `).join('');
            lucide.createIcons();
        }

        function selectLesson(id) {
            activeLessonId = id;
            const folder = LESSON_FOLDERS.find(f => f.id === id);
            document.getElementById('lesson-body').innerHTML = folder.content;
            renderLessonFolders();
        }

        function renderQuizFolders() {
            const container = document.getElementById('quiz-folders');
            container.innerHTML = QUIZ_FOLDERS.map(q => {
                const answeredCount = q.questions.filter((_, idx) => userAnswers[`${q.id}-${idx}`] !== undefined).length;
                return `
                    <button onclick="selectQuiz('${q.id}')" class="shrink-0 md:w-full text-left p-3 rounded-xl border transition-all ${activeQuizId === q.id ? 'bg-emerald-50 border-emerald-500 text-emerald-900' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'}">
                        <div class="font-bold text-xs sm:text-sm truncate">${q.title}</div>
                        <div class="text-[11px] text-slate-500 mt-1 flex justify-between">
                            <span>50 Test</span>
                            <span class="font-semibold text-emerald-600">${answeredCount}/50 Çözüldü</span>
                        </div>
                    </button>
                `;
            }).join('');
        }

        function selectQuiz(id) {
            activeQuizId = id;
            renderQuizFolders();
            const folder = QUIZ_FOLDERS.find(q => q.id === id);
            const container = document.getElementById('quiz-container');

            let html = `
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm mb-5 flex flex-wrap items-center justify-between gap-3">
                    <div>
                        <h2 class="text-lg font-bold text-slate-800">${folder.title}</h2>
                        <p class="text-xs text-slate-500">${folder.desc}</p>
                    </div>
                    <button onclick="resetQuizFolder('${folder.id}')" class="px-3 py-1.5 text-xs font-semibold text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-lg">Klasörü Sıfırla</button>
                </div>
                <div class="space-y-4">
            `;

            folder.questions.forEach((item, idx) => {
                const key = `${folder.id}-${idx}`;
                const chosen = userAnswers[key];
                html += `
                    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                        <div class="flex items-start gap-2.5 mb-3">
                            <span class="px-2.5 py-0.5 rounded-lg bg-slate-100 text-slate-700 font-bold text-xs shrink-0 mt-0.5">${idx + 1}</span>
                            <p class="font-semibold text-slate-800 text-sm sm:text-base leading-relaxed">${item.q}</p>
                        </div>
                        <div class="grid sm:grid-cols-2 gap-2">
                            ${item.a.map((opt, optIdx) => {
                                let btnStyle = 'border-slate-200 hover:border-emerald-400 hover:bg-emerald-50/40 text-slate-700';
                                if (chosen !== undefined) {
                                    if (optIdx === item.c) btnStyle = 'bg-emerald-600 border-emerald-600 text-white font-semibold';
                                    else if (optIdx === chosen) btnStyle = 'bg-rose-500 border-rose-500 text-white';
                                    else btnStyle = 'border-slate-100 text-slate-400 opacity-70';
                                }
                                return `<button onclick="answerQuestion('${folder.id}', ${idx}, ${optIdx})" class="text-left px-3.5 py-2.5 rounded-xl border text-xs sm:text-sm transition-all ${btnStyle}">${opt}</button>`;
                            }).join('')}
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function answerQuestion(folderId, qIdx, optIdx) {
            const key = `${folderId}-${qIdx}`;
            if (userAnswers[key] !== undefined) return;
            userAnswers[key] = optIdx;
            updateGlobalScore();
            selectQuiz(folderId);
        }

        function resetQuizFolder(folderId) {
            const folder = QUIZ_FOLDERS.find(q => q.id === folderId);
            folder.questions.forEach((_, idx) => delete userAnswers[`${folderId}-${idx}`]);
            updateGlobalScore();
            selectQuiz(folderId);
        }

        function updateGlobalScore() {
            let correct = 0;
            QUIZ_FOLDERS.forEach(f => {
                f.questions.forEach((q, idx) => {
                    if (userAnswers[`${f.id}-${idx}`] === q.c) correct++;
                });
            });
            document.getElementById('global-score').textContent = `${correct} Doğru`;
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
